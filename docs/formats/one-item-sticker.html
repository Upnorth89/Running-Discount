<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@500;700;800&display=swap">
<style>
html,body{margin:0;width:1080px;height:1920px;background:#141F1A;font-family:Inter;overflow:hidden}
.p{position:absolute;left:0;right:0;top:218px;height:1302px;background:#fff}
.img{position:absolute;left:30px;right:30px;top:120px;height:1060px;display:flex;align-items:center;justify-content:center}
.img img{max-width:1000px;max-height:1040px}
.st{position:absolute;right:46px;top:70px;width:470px;height:470px;border-radius:50%;background:#1F9256;color:#fff;transform:rotate(-12deg);
 display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 18px 40px rgba(0,0,0,.25);border:10px solid #fff;outline:6px solid #1F9256}
.st *{white-space:nowrap}.st .a{font:800 84px/1 'Barlow Condensed';letter-spacing:.02em}
.st .b{font:800 138px/0.95 'Barlow Condensed'}
html.fr .st .a{font-size:74px}html.fr .st .b{font-size:116px}html.fr .st .c{font-size:34px}
.st .c{font:700 40px/1.2 Inter;opacity:.95;margin-top:8px}
.nm{position:absolute;left:44px;right:44px;bottom:44px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px}
.nm .t{font:800 54px/1.1 Inter;color:#17201C}
.nm .s{font:500 38px/1.2 Inter;color:#5E6762;margin-top:8px}
.cc{background:#17201C;color:#fff;font:800 40px/1 Inter;padding:8px 14px;border-radius:12px;white-space:nowrap}
.end{position:absolute;inset:0;background:rgba(20,31,26,.88)}
.lc{position:absolute;left:220px;top:600px;width:640px;height:280px;background:#fff;border-radius:30px;display:flex;align-items:center;justify-content:center}
.lc img{width:560px}
.lib{position:absolute;left:0;right:0;top:930px;text-align:center;color:#fff;font:800 120px/1 'Barlow Condensed'}
.tag{position:absolute;left:0;right:0;top:1075px;text-align:center;color:#E8ECE9;font:500 44px Inter}
.url{position:absolute;left:0;right:0;top:1140px;text-align:center;color:#fff;font:700 50px Inter}
</style></head><body><div class="p"><div class="img"><img src="product.png"><!-- put the store photo beside this file as product.png (never commit it) --></div>
<div class="st" id="st"></div>
<div class="nm"><div><div class="t">Thule Urban Glide 3 Single</div><div class="s" id="s"></div></div><span class="cc">CA</span></div></div>
<script>
const fr=new URLSearchParams(location.search).get('l')=='fr';if(fr)document.documentElement.classList.add('fr');
document.getElementById('st').innerHTML=fr?'<div class="a">MOITIÉ PRIX</div><div class="b">449,98&nbsp;$</div><div class="c">au lieu de 899,95&nbsp;$</div>':'<div class="a">HALF PRICE</div><div class="b">$449.98</div><div class="c">was $899.95</div>';
document.getElementById('s').textContent=fr?'Poussette de course · Midnight Blue · Bushtukah':'Running stroller · Midnight Blue · Bushtukah';
if(new URLSearchParams(location.search).get('s')=='c'){const e=document.createElement('div');e.className='end';e.innerHTML='<div class="lc"><img src="logo.svg"></div><div class="lib">'+(fr?'LIEN DANS LA BIO':'LINK IN BIO')+'</div><div class="tag">'+(fr?'Les aubaines à votre taille, Canada et É.-U.':'Deals in your size, Canada & USA')+'</div><div class="url">thegearfox.com</div>';document.body.appendChild(e);}
</script></body></html>
