name: Instagram brief

on:
  schedule:
    - cron: "33 17 * * 3"    # backup only: the Wednesday morning refresh starts it right after the deploy (refresh.yml igbrief)
  workflow_dispatch: {}      # "Run workflow" button: send this week's kit now

permissions:
  contents: read
  actions: read

jobs:
  # the backup schedule stops if today's kit already went out (no second email)
  sent:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.today.outputs.skip }}
    steps:
      - id: today
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          today=$(TZ=America/Vancouver date +%F)
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ig-brief.yml/runs?status=success&per_page=10" \
              --jq "[.workflow_runs[] | select(.created_at >= \"${today}T07:00:00Z\")] | length")
          echo "kits sent today: $n"
          if [ "$n" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi

  brief:
    needs: sent
    if: needs.sent.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt playwright imageio-ffmpeg
      - run: python -m playwright install --with-deps chromium
      - name: Price history (for the Reel's real drops)
        run: git fetch --depth=1 origin history && git show FETCH_HEAD:prices.jsonl > /tmp/prices.jsonl
      - name: Build and email the kit
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          HEALTH_EMAIL: ${{ secrets.HEALTH_EMAIL }}
          FROM_EMAIL: "The Gear Fox <deals@thegearfox.com>"
          HISTORY_FILE: /tmp/prices.jsonl
        run: python scraper/ig_brief.py
