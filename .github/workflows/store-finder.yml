name: Store finder

# Which shops in tools/us_candidates.txt have a readable Shopify feed (tools/find_stores.py). Run by hand; results in the
# run's annotations. One light look per shop, nothing blocked.
on:
  workflow_dispatch:

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - run: python tools/find_stores.py tools/us_candidates.txt
