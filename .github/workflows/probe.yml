name: Probe

# Can GitHub's servers read a store? (tools/probe.py; Oct 10). One plain visit per address; results in the run's annotations.
on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Addresses separated by spaces'
        required: true
      grep:
        description: 'Show up to 80 matches of this pattern per page'
        required: false
        default: ''
      save:
        description: 'Keep the pages (artifact "probe")'
        type: boolean
        default: false
      honest:
        description: 'Use our own bot name'
        type: boolean
        default: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - env:
          URLS: ${{ inputs.urls }}
          GREP: ${{ inputs.grep }}
          SAVE: ${{ inputs.save && '1' || '' }}
          HONEST: ${{ inputs.honest && '1' || '' }}
        run: python tools/probe.py
      - if: inputs.save
        uses: actions/upload-artifact@v4
        with:
          name: probe
          path: probe-out/
