name: Log scan (addresses in public run logs)

# Nov 5, 2026 (growth night shift, privacy): the repo is public, so Actions run logs are readable by anyone signed in to GitHub.
# This lists runs (every workflow) created since SINCE, downloads each job's log and counts FULL email addresses in it
# (masked "ab…@gmail.com", our own @thegearfox.com, GitHub/noreply ones and the Resend sender don't count).
# It prints ONLY run ids, workflow names, dates and counts: never an address. Run by hand.
on:
  workflow_dispatch:
    inputs:
      since:
        description: "Scan runs created on/after this UTC time (ISO), e.g. 2026-10-30T14:00:00Z"
        required: true
        default: "2026-10-30T14:00:00Z"
      delete:
        description: "Run ids whose LOGS to delete (space-separated; only if they hold a full address; the runs, artifacts and caches stay)"
        required: false
        default: ""

permissions:
  actions: write     # Nov 5 (Bastien: yes to deleting logs that print subscriber addresses): DELETE /actions/runs/{id}/logs only

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Scan logs
        env:
          GH_TOKEN: ${{ github.token }}
          SINCE: ${{ inputs.since }}
          DELETE_RUNS: ${{ inputs.delete }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'EOF'
          import json, os, re, urllib.request, urllib.error, collections
          tok, repo, since = os.environ["GH_TOKEN"], os.environ["REPO"], os.environ["SINCE"]
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *a, **k):
                  return None
          noredir = urllib.request.build_opener(NoRedirect)
          stats = collections.Counter()
          def api(path, raw=False):
              req = urllib.request.Request(f"https://api.github.com/repos/{repo}{path}",
                                           headers={"Authorization": f"Bearer {tok}", "Accept": "application/vnd.github+json"})
              try:
                  with noredir.open(req, timeout=60) as r:
                      b = r.read()
                      return b.decode("utf-8", "ignore") if raw else json.loads(b)
              except urllib.error.HTTPError as e:
                  # job logs answer 302 -> a signed storage URL: fetch it WITHOUT our token (sending it there fails)
                  if e.code in (301, 302, 303, 307, 308) and e.headers.get("Location"):
                      try:
                          with urllib.request.urlopen(e.headers["Location"], timeout=120) as r:
                              b = r.read()
                              return b.decode("utf-8", "ignore") if raw else json.loads(b)
                      except Exception:
                          stats["redirect failed"] += 1
                          return None
                  stats[f"http {e.code}"] += 1
                  return None
              except Exception:
                  stats["error"] += 1
                  return None
          def delete_logs(run_id):
              req = urllib.request.Request(f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/logs", method="DELETE",
                                           headers={"Authorization": f"Bearer {tok}", "Accept": "application/vnd.github+json"})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return r.status
              except urllib.error.HTTPError as e:
                  return e.code
          ADDR = re.compile(r"[A-Za-z0-9._%+-]+@([A-Za-z0-9-]+\.)+[A-Za-z]{2,}")
          OK = re.compile(r"(thegearfox\.com|github\.com|noreply|users\.noreply|example\.com|anthropic\.com|resend\.dev)$", re.I)
          def count_addr(run_id):
              n = 0
              for j in (api(f"/actions/runs/{run_id}/jobs?per_page=100") or {}).get("jobs") or []:
                  t = api(f"/actions/jobs/{j['id']}/logs", raw=True) or ""
                  for m in ADDR.finditer(t):
                      local, dom = m.group(0).split("@", 1)
                      if not (local.endswith("…") or local.endswith("...") or OK.search(dom)):
                          n += 1
              return n
          for rid in os.environ.get("DELETE_RUNS", "").split():
              n = count_addr(rid)
              if not n:
                  print(f"run {rid}: no full address in its logs: NOT deleted")
                  continue
              code = delete_logs(rid)
              print(f"run {rid}: {n} address mention(s); delete logs -> HTTP {code}" + (" (deleted)" if code == 204 else ""))
              print(f"run {rid}: after: {count_addr(rid)} address mention(s) left")
          runs, page = [], 1
          while True:
              d = api(f"/actions/runs?per_page=100&page={page}&created=>={since}")
              if not d or not d.get("workflow_runs"):
                  break
              runs += d["workflow_runs"]; page += 1
              if page > 30: break
          print(f"{len(runs)} runs since {since}")
          hits = []
          for r in runs:
              jobs = (api(f"/actions/runs/{r['id']}/jobs?per_page=100") or {}).get("jobs") or []
              n = 0
              for j in jobs:
                  t = api(f"/actions/jobs/{j['id']}/logs", raw=True) or ""
                  stats["logs read" if t else "logs empty/missing"] += 1
                  for m in ADDR.finditer(t):
                      a = m.group(0)
                      local, dom = a.split("@", 1)
                      if local.endswith("…") or local.endswith("...") or OK.search(dom):
                          continue
                      n += 1
              if n:
                  hits.append((r["id"], r["name"], r["created_at"], n))
          by = collections.Counter(h[1] for h in hits)
          print("LOG STATS: " + ", ".join(f"{k} {v}" for k, v in stats.items()))
          print(f"RUNS WITH FULL ADDRESSES: {len(hits)}  " + ", ".join(f"{k}: {v}" for k, v in by.items()))
          for h in hits:
              print(f"  run {h[0]}  {h[1]}  {h[2]}  {h[3]} address mention(s)")
          print(f"::notice::{len(hits)} runs with full addresses since {since}: " + " ".join(str(h[0]) for h in hits))
          EOF
