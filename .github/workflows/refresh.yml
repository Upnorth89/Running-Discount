name: Refresh deals

on:
  schedule:
    - cron: "17 11 * * *"   # daily, 4:17am Vancouver (PDT)
    - cron: "47 14 * * *"   # backup, 7:47am Vancouver: GitHub sometimes starts schedules hours late or skips them
    - cron: "17 23 * * *"   # afternoon, 4:17pm Vancouver / 7:17pm Montréal (Oct 6: 12 h after the morning run, fresh for after-work
                            # browsing): fresh prices and stock + the "Gear Fox afternoon check" email; no watchlist alerts (morning only)
  workflow_dispatch:          # "Run workflow" button; Supabase's 4:17am timer starts it with morning=true
    inputs:                   # (supabase/morning-timer.sql: on time, unlike GitHub's schedules)
      morning:
        description: "Morning run (health email, skipped if today's report already went out)"
        type: boolean
        default: false
      afternoon:
        description: "Afternoon run (afternoon health email, skipped if today's afternoon check already went out)"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write     # the build pushes the daily price history to the "history" branch (not the site)
  pages: write
  id-token: write

# One build and one deploy at a time. Set per job, not for the whole workflow (Oct 8): GitHub keeps only one run waiting
# per group, so a late schedule run that the check job then skips bumped a waiting push run out of the queue (8086c30
# never published). A skipped build never enters the queue now.

jobs:
  # a morning run (schedule or Supabase's timer) stops here if today's morning refresh already happened
  # (so a second start doesn't send a second health email); uploads and the "Run workflow" button always go ahead
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.today.outputs.skip }}
      morning: ${{ steps.today.outputs.morning }}
    steps:
      - id: today
        run: |
          skip=false
          today=$(TZ=America/Vancouver date +%F)
          field=""
          if { [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" != "17 23 * * *" ]; } || [ "${{ inputs.morning }}" = "true" ]; then field=reported; fi
          # afternoon (Oct 6, 2026): Supabase starts it on time (afternoon=true); GitHub's late 23:17 schedule is the backup
          if [ "${{ github.event.schedule }}" = "17 23 * * *" ] || [ "${{ inputs.afternoon }}" = "true" ]; then field=midday; fi
          if [ -n "$field" ]; then
            last=$(curl -fsSL "https://thegearfox.com/health.json?t=$(date +%s)" | python3 -c "import json,sys; print(json.load(sys.stdin).get('$field') or '')" || true)
            echo "last $field report: ${last:-none}, today: $today"
            [ "$last" = "$today" ] && skip=true
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          [ "$field" = reported ] && echo "morning=true" >> "$GITHUB_OUTPUT" || true

  build:
    needs: check
    concurrency:
      group: pages-build
      cancel-in-progress: false
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # full history, so saved MEC/REI pages can be dated by upload
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      # start from the live file so a store that fails today keeps yesterday's deals
      - name: Fetch yesterday's data
        continue-on-error: true
        run: |
          BASE="https://thegearfox.com"
          curl -fsSL "$BASE/deals.json" -o site/deals.json || true
          curl -fsSL "$BASE/offers.json" -o site/offers.json || true
          curl -fsSL "$BASE/health.json" -o site/health.json || true
          mkdir -p site/shoes && curl -fsSL "$BASE/shoes/pages.json" -o site/shoes/pages.json || true   # models that have a page (pages never disappear)
          mkdir -p site/us/shoes && curl -fsSL "$BASE/us/shoes/pages.json" -o site/us/shoes/pages.json || true   # same for the USA side
          # last night's RunFree read (scraper/runfree.py, runfree.yml), kept on the history branch
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/history/runfree.json" -o /tmp/runfree.json || true
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/history/decathlon.json" -o /tmp/decathlon.json || true
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/history/thefeed.json" -o /tmp/thefeed.json || true
          mkdir -p /tmp/prev && cp site/deals.json site/offers.json site/health.json /tmp/prev/ 2>/dev/null || true
      - name: Keep the subscriber database awake
        continue-on-error: true
        run: |
          curl -fsS -X POST "https://krwymmkauwqqxjxbvkyq.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_zRrZ7lk8fCbjdTV3tgVD5g_PtxgHOD2" -H "Content-Type: application/json" -d '{}' || true
      - name: Scrape stores
        env:                       # SUPABASE_*: deals sent from the phone "Grab deals" bookmark (grab_saves, Oct 8)
          SUPABASE_URL: "https://krwymmkauwqqxjxbvkyq.supabase.co"
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scraper/scrape.py site/deals.json
      # price history ("Is this deal real?"): lives on the history branch, so a failed download can't wipe it
      - name: Fetch price history
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: history
          path: hist
      - name: Price history
        continue-on-error: true
        run: |
          if [ -f hist/prices.jsonl ]; then
            python scraper/history.py hist/prices.jsonl site ${{ github.event_name == 'push' && '--no-save' || '' }}
          else
            echo "no price history checked out: skipped"
          fi
      # Oct 8 (Bastien: "I want the most accurate information for our users"): the deals people see most are opened on the
      # store's own page; an ended sale or sold-out size is taken off before anything is published (scraper/featured_check.py)
      - name: Check featured deals on the store pages
        continue-on-error: true
        run: python scraper/featured_check.py site
      - name: Shoe pages for Google (one per popular model, EN/FR) + sitemap
        continue-on-error: true
        run: python scraper/shoe_pages.py site
      # a robot visitor clicks through today's site before it goes live: sizes, every category, one search per category,
      # filters, hearts, menu, French, shoe pages, links (tools/sitetest.py, Oct 5, 2026). Results go in the health email;
      # a critical failure (no deals, crash, empty shoe pages) is retried once, then stops publishing (see below).
      - name: Site test
        continue-on-error: true
        run: |
          pip install -q playwright && python -m playwright install --with-deps chromium > /dev/null
          python tools/sitetest.py site /tmp/sitetest.json
          if python3 -c "import json,sys; sys.exit(1 if json.load(open('/tmp/sitetest.json'))['critical'] else 0)"; then exit 0; fi
          echo "critical failure: running the site test once more"
          python tools/sitetest.py site /tmp/sitetest.json
      - name: Site test screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: sitetest
          path: /tmp/sitetest*
          if-no-files-found: ignore
      - name: Save price history
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          cd hist
          git config user.name "The Gear Fox"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.jsonl
          git diff --cached --quiet || git commit -q -m "prices $(TZ=America/Vancouver date +%F)"
          git push -q origin HEAD:history
      # price-drop / back-in-your-size emails, only on the morning run (not on every upload)
      - name: Watchlist alerts
        if: github.event_name != 'push' && github.event.schedule != '17 23 * * *' && !inputs.afternoon
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SITE_URL: "https://thegearfox.com/"
          FROM_EMAIL: "The Gear Fox <deals@thegearfox.com>"
          SUPABASE_URL: "https://krwymmkauwqqxjxbvkyq.supabase.co"
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MAILING_ADDRESS: ${{ secrets.MAILING_ADDRESS }}
        run: python scraper/alerts.py site/deals.json
      # compares today with yesterday; emails hello@thegearfox.com only about new problems (morning run only)
      - name: Health check
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: "The Gear Fox <deals@thegearfox.com>"
          SUPABASE_URL: "https://krwymmkauwqqxjxbvkyq.supabase.co"
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SEND_HEALTH: ${{ (github.event_name == 'schedule' || inputs.morning || inputs.afternoon) && '1' || '0' }}   # morning report + a midday one (Oct 5)
          HEALTH_WHEN: ${{ (github.event.schedule == '17 23 * * *' || inputs.afternoon) && 'midday' || 'morning' }}
          HEALTH_EMAIL: ${{ secrets.HEALTH_EMAIL }}
        run: python scraper/health.py /tmp/prev site
      - name: Keep yesterday's site if the shoe pages didn't build or the site test failed
        # the shoe pages step may fail quietly (continue-on-error); publishing without it would 404 every shoe page,
        # list page and the sitemap (Oct 4, 2026). Stopping here keeps the last good site live; the health email says why.
        run: |
          n=$(ls site/shoes/*/index.html 2>/dev/null | wc -l)
          echo "shoe pages built: $n"
          if [ "$n" -lt 100 ] || [ ! -f site/sitemap.xml ]; then echo "::error::Shoe pages missing: not publishing"; exit 1; fi
          # the site test's critical checks (only when it ran: a test that couldn't start never blocks the site)
          if [ -f /tmp/sitetest.json ]; then
            python3 -c "import json,sys; c=json.load(open('/tmp/sitetest.json'))['critical']; c and print('::error::Site test: ' + ', '.join(c) + ': not publishing'); sys.exit(1 if c else 0)"
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Wednesdays (Oct 7, 2026): the Instagram kit starts right after the morning deploy, so it's built from this
  # morning's prices (GitHub ran its own Wednesday schedule 6 h late, after a store had ended its sale)
  igbrief:
    needs: [check, deploy]
    if: needs.check.outputs.morning == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(TZ=America/Vancouver date +%u)" = 3 ]; then gh workflow run ig-brief.yml --repo "$GITHUB_REPOSITORY" --ref main; fi
