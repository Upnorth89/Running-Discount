name: Weekly deals email

on:
  schedule:
        - cron: "7 9-18 * * 5"  # every hour on Friday, 9:07-18:07 UTC: each run sends to people for whom it's now 7am+
        - cron: "7 9-18 * * 6"  # Oct 27, test 'emailday': Saturdays too (group B gets it Saturday 7am, Oct 31 - Nov 21; nobody else is due)
  workflow_dispatch:         # "Run workflow" button for a test send
    inputs:
      send_to:
        description: "Your email for a test (only you get it). everyone = all subscribers now. due = the normal Friday send (7am local, once each)."
        required: true
        default: ""

jobs:
  email:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - name: Price history (for "Dropped this week in your size")
        run: git fetch --depth=1 origin history && git show FETCH_HEAD:prices.jsonl > /tmp/prices.jsonl || true
      - name: Send weekly email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SITE_URL: "https://thegearfox.com/"
          FROM_EMAIL: "The Gear Fox <deals@thegearfox.com>"
          SUPABASE_URL: "https://krwymmkauwqqxjxbvkyq.supabase.co"
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MAILING_ADDRESS: ${{ secrets.MAILING_ADDRESS }}
          SEND_TO: ${{ inputs.send_to }}
          HISTORY_FILE: /tmp/prices.jsonl
        run: python scraper/weekly_email.py
