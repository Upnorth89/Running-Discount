name: Weekly deals email

on:
  schedule:
    - cron: "7 14 * * 6"    # Saturdays 7:07am Vancouver in summer (6:07am in winter)
  workflow_dispatch: {}      # "Run workflow" button for a test send

jobs:
  email:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - name: Send weekly email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SITE_URL: "https://thegearfox.com/"
          FROM_EMAIL: "The Gear Fox <deals@thegearfox.com>"
          SUPABASE_URL: "https://krwymmkauwqqxjxbvkyq.supabase.co"
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MAILING_ADDRESS: ${{ secrets.MAILING_ADDRESS }}
        run: python scraper/weekly_email.py
