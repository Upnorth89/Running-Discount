name: Mail check

# Read-only: why didn't a sign-up email arrive? Asks Resend about the latest emails and the database about recent
# sign-up attempts (tools/mail_check.py). Run by hand; Claude reads the result from the run's annotations.
on:
  workflow_dispatch:
    inputs:
      find:
        description: "Look one person up: sha256 of their address, or of the part before @ (never the address itself: the repo is public)"
        required: false
        default: ""
      stats:
        description: "Test the stats page's own calls with the real key (yes/blank)"
        required: false
        default: ""

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - if: ${{ inputs.stats != '' }}
        run: pip install playwright && python -m playwright install --with-deps chromium
      - env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWN_EMAIL: ${{ secrets.HEALTH_EMAIL }}
          SUPABASE_URL: "https://krwymmkauwqqxjxbvkyq.supabase.co"
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          FIND: ${{ inputs.find }}
          STATS: ${{ inputs.stats }}
        run: python tools/mail_check.py
