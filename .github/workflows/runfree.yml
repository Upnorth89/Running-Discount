name: Night reads (RunFree stores, Decathlon)

# Local US running stores on RunFree (scraper/runfree.py): every product's sizes and prices, one request per second per
# store, all stores at once. 1:23am Vancouver, well before the 4:17am refresh, which downloads runfree.json from the
# history branch (data only). A store that fails keeps its last good read.
on:
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:          # Supabase starts it on time with night=true (supabase/timers.sql); the button runs it anyway
    inputs:
      night:
        description: "Night run (skipped if tonight's read already happened)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: runfree
  cancel-in-progress: false

jobs:
  # GitHub's schedule can start hours late: a scheduled or Supabase-started run stops here if the last read is under 12 h old
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.c.outputs.skip }}
    steps:
      - id: c
        run: |
          skip=false
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.night }}" = "true" ]; then
            t=$(curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/history/runfree.json" | python3 -c "import json,sys; print(json.load(sys.stdin).get('updated',''))" || true)
            echo "last read: ${t:-none}"
            [ -n "$t" ] && python3 -c "import sys,datetime as d; t=d.datetime.fromisoformat('$t'); sys.exit(0 if d.datetime.now(d.timezone.utc)-t<d.timedelta(hours=12) else 1)" && skip=true
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  read:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - name: Last read and saved product details
        uses: actions/checkout@v4
        with:
          ref: history
          path: hist
      - name: Read the RunFree stores
        run: python scraper/runfree.py hist
      - name: Save to the history branch
        run: |
          cd hist
          git config user.name "The Gear Fox"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runfree.json runfree-cache.json
          git diff --cached --quiet && exit 0
          git commit -q -m "runfree $(TZ=America/Vancouver date +%F)"
          for i in 1 2 3 4; do git pull -q --rebase origin history && git push -q origin HEAD:history && exit 0; sleep $((i * 5)); done
          exit 1

  # Decathlon (Oct 6, 2026): blocked GitHub's daytime reads ("429 too many requests"), so it's read here, one page every
  # 6 seconds; if it still says no, it stops for the night and the last good read stays
  decathlon:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - uses: actions/checkout@v4
        with:
          ref: history
          path: hist
      - name: Read Decathlon slowly
        run: python scraper/scrape.py --decathlon-night hist/decathlon.json
      - name: Save to the history branch
        run: |
          cd hist
          git config user.name "The Gear Fox"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f decathlon.json ] || exit 0
          git add decathlon.json
          git diff --cached --quiet && exit 0
          git commit -q -m "decathlon $(TZ=America/Vancouver date +%F)"
          for i in 1 2 3 4; do git pull -q --rebase origin history && git push -q origin HEAD:history && exit 0; sleep $((i * 5)); done
          exit 1
