name: Night reads (RunFree stores, Decathlon, The Feed)

# Local US running stores on RunFree (scraper/runfree.py): every product's sizes and prices, one request per second per
# store, all stores at once. 1:23am Vancouver, well before the 4:17am refresh, which downloads runfree.json from the
# history branch (data only). A store that fails keeps its last good read.
on:
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:          # Supabase starts it on time with night=true (supabase/timers.sql); the button runs it anyway
    inputs:
      night:
        description: "Night run (skipped if tonight's read already happened)"
        type: boolean
        default: false
      only:
        description: "Run only this read (all, runfree, decathlon, thefeed, runningfree, sportsexperts, brands)"
        default: "all"
      brand:
        description: "With 'brands': only these brand stores, comma-separated (saucony, arcteryx, salomon); the others keep last night's copy"
        default: ""

permissions:
  contents: write

concurrency:
  group: runfree
  cancel-in-progress: false

jobs:
  # GitHub's schedule can start hours late: a scheduled or Supabase-started run stops here if the last read is under 12 h old
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.c.outputs.skip }}
    steps:
      - id: c
        run: |
          skip=false
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.night }}" = "true" ]; then
            t=$(curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/history/runfree.json" | python3 -c "import json,sys; print(json.load(sys.stdin).get('updated',''))" || true)
            echo "last read: ${t:-none}"
            [ -n "$t" ] && python3 -c "import sys,datetime as d; t=d.datetime.fromisoformat('$t'); sys.exit(0 if d.datetime.now(d.timezone.utc)-t<d.timedelta(hours=12) else 1)" && skip=true
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  read:
    needs: check
    if: needs.check.outputs.skip != 'true' && (inputs.only == '' || inputs.only == null || inputs.only == 'all' || inputs.only == 'runfree')
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - name: Last read and saved product details
        uses: actions/checkout@v4
        with:
          ref: history
          path: hist
      - name: Read the RunFree stores
        run: python scraper/runfree.py hist
      - name: Save to the history branch
        run: |
          cd hist
          git config user.name "The Gear Fox"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runfree.json runfree-cache.json
          git diff --cached --quiet && exit 0
          git commit -q -m "runfree $(TZ=America/Vancouver date +%F)"
          for i in 1 2 3 4; do git pull -q --rebase origin history && git push -q origin HEAD:history && exit 0; sleep $((i * 5)); done
          exit 1

  # The Feed (Oct 8, 2026): its products.json answers "429 local_rate_limited" to busy shared addresses like GitHub's, and
  # our morning reads failed twice in two days. Read here at night, a page every 10 s, waiting as long as it asks
  thefeed:
    needs: check
    if: needs.check.outputs.skip != 'true' && (inputs.only == '' || inputs.only == null || inputs.only == 'all' || inputs.only == 'thefeed')
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - uses: actions/checkout@v4
        with:
          ref: history
          path: hist
      - name: Read The Feed slowly
        run: python scraper/scrape.py --thefeed-night hist/thefeed.json
      - name: Save to the history branch
        if: success()
        run: |
          cd hist
          git config user.name "The Gear Fox"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f thefeed.json ] || exit 0
          git add thefeed.json
          git diff --cached --quiet && exit 0
          git commit -q -m "thefeed $(TZ=America/Vancouver date +%F)"
          for i in 1 2 3 4; do git pull -q --rebase origin history && git push -q origin HEAD:history && exit 0; sleep $((i * 5)); done
          exit 1

  # Running Free (Oct 9, 2026; Ontario chain, own shop system, no feed): its listing and size pages, one every 30 s as its
  # robots.txt asks (about 2 hours). If it doesn't finish, the last good copy stays.
  runningfree:
    needs: check
    if: needs.check.outputs.skip != 'true' && (inputs.only == '' || inputs.only == null || inputs.only == 'all' || inputs.only == 'runningfree')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - uses: actions/checkout@v4
        with:
          ref: history
          path: hist
      - name: Read Running Free slowly
        run: python scraper/scrape.py --runningfree-night hist/runningfree.json
      - name: Save to the history branch
        if: success()
        run: |
          cd hist
          git config user.name "The Gear Fox"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f runningfree.json ] || exit 0
          git add runningfree.json
          git diff --cached --quiet && exit 0
          git commit -q -m "runningfree $(TZ=America/Vancouver date +%F)"
          for i in 1 2 3 4; do git pull -q --rebase origin history && git push -q origin HEAD:history && exit 0; sleep $((i * 5)); done
          exit 1

  # Sports Experts (Oct 15, 2026; Québec chain): its wall stops Claude's sandbox but not GitHub's servers, and robots.txt allows
  # category and product pages. Listing pages + every product page (sizes in stock), a page every 3 s (~1 h).
  sportsexperts:
    needs: check
    if: needs.check.outputs.skip != 'true' && (inputs.only == '' || inputs.only == null || inputs.only == 'all' || inputs.only == 'sportsexperts')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - uses: actions/checkout@v4
        with:
          ref: history
          path: hist
      - name: Read Sports Experts
        run: python scraper/scrape.py --sportsexperts-night hist/sportsexperts.json
      - name: Save to the history branch
        if: success()
        run: |
          cd hist
          git config user.name "The Gear Fox"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f sportsexperts.json ] || exit 0
          git add sportsexperts.json
          git diff --cached --quiet && exit 0
          git commit -q -m "sportsexperts $(TZ=America/Vancouver date +%F)"
          for i in 1 2 3 4; do git pull -q --rebase origin history && git push -q origin HEAD:history && exit 0; sleep $((i * 5)); done
          exit 1

  # Brand stores (Oct 16, 2026; Saucony first): listing pages + each colour's page and size list, a page every 3 s.
  brands:
    needs: check
    if: needs.check.outputs.skip != 'true' && (inputs.only == '' || inputs.only == null || inputs.only == 'all' || inputs.only == 'brands')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - uses: actions/checkout@v4
        with:
          ref: history
          path: hist
      - name: Read brand stores
        env:
          BRANDS_ONLY: ${{ inputs.brand }}
        run: python scraper/scrape.py --brands-night hist/brands.json
      - name: Save to the history branch
        if: success()
        run: |
          cd hist
          git config user.name "The Gear Fox"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f brands.json ] || exit 0
          git add brands.json
          git diff --cached --quiet && exit 0
          git commit -q -m "brands $(TZ=America/Vancouver date +%F)"
          for i in 1 2 3 4; do git pull -q --rebase origin history && git push -q origin HEAD:history && exit 0; sleep $((i * 5)); done
          exit 1

  # Decathlon (Oct 6, 2026): blocked GitHub's daytime reads ("429 too many requests"), so it's read here, one page every
  # 6 seconds; if it still says no, it stops for the night and the last good read stays
  decathlon:
    needs: check
    if: needs.check.outputs.skip != 'true' && (inputs.only == '' || inputs.only == null || inputs.only == 'all' || inputs.only == 'decathlon')
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - uses: actions/checkout@v4
        with:
          ref: history
          path: hist
      - name: Read Decathlon slowly
        run: python scraper/scrape.py --decathlon-night hist/decathlon.json
      - name: Save to the history branch
        run: |
          cd hist
          git config user.name "The Gear Fox"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f decathlon.json ] || exit 0
          git add decathlon.json
          git diff --cached --quiet && exit 0
          git commit -q -m "decathlon $(TZ=America/Vancouver date +%F)"
          for i in 1 2 3 4; do git pull -q --rebase origin history && git push -q origin HEAD:history && exit 0; sleep $((i * 5)); done
          exit 1

